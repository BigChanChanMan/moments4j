# Port of the TestingConfig profile: in-memory database (unique per context), CSRF note (tests disable CSRF explicitly)
spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: ""   # no mail server in tests: emails are skipped, like debug mode
