<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(title=~{::title}, content=~{::#content})}">
<head>
  <title>Password Reset</title>
</head>
<body>

<section id="content">
<div class="page-header">
  <h1>Password Reset</h1>
</div>
<div class="row">
  <div class="col-sm-4">
    <div class="card mb-3 w-100 bg-light">
      <div class="card-body">
        <!-- one form serves both forget-password (email only) and reset-password (token page) -->
        <form method="post"
              th:action="${token != null ? '/auth/reset-password/' + token : '/auth/forget-password'}"
              th:object="${form}">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}">
          <div class="mb-3" th:with="err=${#fields.hasErrors('email')}">
            <label class="form-label" th:classappend="${err} ? 'text-danger'" for="email">Email</label>
            <input type="email" class="form-control" th:classappend="${err} ? 'is-invalid'" id="email" th:field="*{email}">
            <div class="invalid-feedback" th:if="${err}" th:errors="*{email}">error</div>
          </div>
          <th:block th:if="${token != null}">
            <div class="mb-3" th:with="err=${#fields.hasErrors('password')}">
              <label class="form-label" th:classappend="${err} ? 'text-danger'" for="password">Password</label>
              <input type="password" class="form-control" th:classappend="${err} ? 'is-invalid'" id="password" th:field="*{password}">
              <div class="invalid-feedback" th:if="${err}" th:errors="*{password}">error</div>
            </div>
            <div class="mb-3" th:with="err=${#fields.hasErrors('password2')}">
              <label class="form-label" th:classappend="${err} ? 'text-danger'" for="password2">Confirm password</label>
              <input type="password" class="form-control" th:classappend="${err} ? 'is-invalid'" id="password2" th:field="*{password2}">
              <div class="invalid-feedback" th:if="${err}" th:errors="*{password2}">error</div>
            </div>
          </th:block>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>
</section>

</body>
</html>
