<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(title=~{::title}, content=~{::#content})}">
<head>
  <title>Privacy Settings</title>
</head>
<body>

<section id="content">
<div class="page-header">
  <h1>Settings</h1>
</div>
<div class="row">
<div th:replace="~{user/settings/base :: settings_nav}"></div>
<div class="col-md-9">

  <div class="card w-100 bg-light">
    <h3 class="card-header">Edit Privacy</h3>
    <div class="card-body">
      <form method="post" th:action="@{/user/settings/privacy}" th:object="${form}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="publicCollections" th:field="*{publicCollections}">
          <label class="form-check-label" for="publicCollections">Public my collection</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>
</div>
</div>
</section>

</body>
</html>
