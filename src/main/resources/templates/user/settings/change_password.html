<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(title=~{::title}, content=~{::#content})}">
<head>
  <title>Change Password</title>
</head>
<body>

<section id="content">
<div class="page-header">
  <h1>Settings</h1>
</div>
<div class="row">
<div th:replace="~{user/settings/base :: settings_nav}"></div>
<div class="col-md-9">

  <div class="card w-100 bg-light">
    <h3 class="card-header">Change Password</h3>
    <div class="card-body">
      <form method="post" th:action="@{/user/settings/change-password}" th:object="${form}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="mb-3" th:with="err=${#fields.hasErrors('oldPassword')}">
          <label class="form-label" th:classappend="${err} ? 'text-danger'" for="oldPassword">Old Password</label>
          <input type="password" class="form-control" th:classappend="${err} ? 'is-invalid'" id="oldPassword" th:field="*{oldPassword}">
          <div class="invalid-feedback" th:if="${err}" th:errors="*{oldPassword}">error</div>
        </div>
        <div class="mb-3" th:with="err=${#fields.hasErrors('password')}">
          <label class="form-label" th:classappend="${err} ? 'text-danger'" for="password">New Password</label>
          <input type="password" class="form-control" th:classappend="${err} ? 'is-invalid'" id="password" th:field="*{password}">
          <div class="invalid-feedback" th:if="${err}" th:errors="*{password}">error</div>
        </div>
        <div class="mb-3" th:with="err=${#fields.hasErrors('password2')}">
          <label class="form-label" th:classappend="${err} ? 'text-danger'" for="password2">Confirm Password</label>
          <input type="password" class="form-control" th:classappend="${err} ? 'is-invalid'" id="password2" th:field="*{password2}">
          <div class="invalid-feedback" th:if="${err}" th:errors="*{password2}">error</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>
</div>
</div>
</section>

</body>
</html>
