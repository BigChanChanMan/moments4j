<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/index :: admin_layout(title=~{::title}, content=~{::#content})}">
<head>
  <title>Manage Photos</title>
</head>
<body>

<section id="content">
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li th:replace="~{admin/index :: crumb('/admin/', 'Dashboard Home')}"></li>
    <li class="breadcrumb-item active" aria-current="page">Manage Photo</li>
  </ol>
</nav>
<div class="page-header">
  <h1>Photos
    <small class="text-muted" th:text="${pagination != null ? pagination.totalElements : 0}">0</small>
    <span class="dropdown">
      <button class="btn btn-secondary btn-sm" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown"
        aria-haspopup="true" aria-expanded="false">
        Order by <th:block th:text="${orderRule}">flag</th:block> <i class="bi bi-chevron-expand"></i>
      </button>
      <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
        <th:block th:if="${orderRule == 'flag'}">
          <a class="dropdown-item" href="/admin/manage/photo/by_time">Order by Time</a>
        </th:block>
        <th:block th:if="${orderRule != 'flag'}">
          <a class="dropdown-item" href="/admin/manage/photo/by_flag">Order by Flag</a>
        </th:block>
      </div>
    </span>
  </h1>
</div>
<th:block th:if="${!#lists.isEmpty(photos)}">
<table class="table table-striped">
  <thead>
    <tr>
      <th>Image</th>
      <th>Description</th>
      <th>Tag</th>
      <th>Author</th>
      <th>Reported</th>
      <th>Date</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tr th:each="photo : ${photos}">
    <td>
      <a th:href="@{|/photo/${photo.id}|}">
        <img th:src="@{|/images/${photo.filenameS}|}" width="250">
      </a>
    </td>
    <td th:text="${photo.description}">description</td>
    <td>
      <th:block th:if="${!#lists.isEmpty(photo.tags)}">
        <form class="inline" method="post" th:each="tag : ${photo.tags}"
          th:action="@{|/admin/delete/tag/${tag.id}|(next=${requestPath})}">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}">
          <button type="submit" class="btn badge text-bg-danger rounded-pill mb-1" onclick="return confirm('Are you sure?');">
            <th:block th:text="${tag.name}">tag</th:block> <i class="bi bi-trash-fill"></i>
          </button>
        </form>
      </th:block>
    </td>
    <td>
      <a class="text-decoration-none" th:href="@{|/user/${photo.author.username}|}" th:text="${photo.author.name}">author</a>
    </td>
    <td th:text="${photo.flag}">0</td>
    <td><span class="dayjs" data-format="LL" th:text="${photo.createdAt}">date</span></td>
    <td>
      <form class="inline" method="post"
        th:action="@{|/admin/delete/photo/${photo.id}|(next=${requestPath})}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?');">Delete
        </button>
      </form>
    </td>
  </tr>
</table>
<div class="page-footer">
  <div th:replace="~{macros :: pagination(${pagination}, '/admin/manage/photo/' + ${orderRule == 'time' ? 'by_time' : 'by_flag'})}"></div>
</div>
</th:block>
<th:block th:if="${#lists.isEmpty(photos)}">
  <div class="tip">
    <h5>No photos.</h5>
  </div>
</th:block>
</section>

</body>
</html>
