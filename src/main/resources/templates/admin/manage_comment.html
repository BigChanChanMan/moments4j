<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/index :: admin_layout(title=~{::title}, content=~{::#content})}">
<head>
  <title>Manage Comments</title>
</head>
<body>

<section id="content">
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li th:replace="~{admin/index :: crumb('/admin/', 'Dashboard Home')}"></li>
    <li class="breadcrumb-item active" aria-current="page">Manage Comment</li>
  </ol>
</nav>
<div class="page-header">
  <h1>Comments
    <small class="text-muted" th:text="${pagination != null ? pagination.totalElements : 0}">0</small>
    <span class="dropdown">
      <button class="btn btn-secondary btn-sm" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown"
        aria-haspopup="true" aria-expanded="false">
        Order by <th:block th:text="${orderRule}">flag</th:block> <i class="bi bi-chevron-expand"></i>
      </button>
      <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
        <th:block th:if="${orderRule == 'flag'}">
          <a class="dropdown-item" href="/admin/manage/comment/by_time">Order by Time</a>
        </th:block>
        <th:block th:if="${orderRule != 'flag'}">
          <a class="dropdown-item" href="/admin/manage/comment/by_flag">Order by Flag</a>
        </th:block>
      </div>
    </span>
  </h1>
</div>
<th:block th:if="${!#lists.isEmpty(comments)}">
<table class="table table-striped">
  <thead>
    <tr>
      <th>Body</th>
      <th>Author</th>
      <th>Image</th>
      <th>Reported</th>
      <th>Date</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tr th:each="comment : ${comments}">
    <td th:text="${comment.body}">body</td>
    <td>
      <a class="text-decoration-none" th:href="@{|/user/${comment.author.username}|}" th:text="${comment.author.name}">author</a>
    </td>
    <td>
      <a class="text-decoration-none" th:href="@{|/photo/${comment.photo.id}|}">Photo <th:block th:text="${comment.photo.id}">0</th:block></a>
    </td>
    <td th:text="${comment.flag}">0</td>
    <td><span class="dayjs" data-format="LL" th:text="${comment.createdAt}">date</span></td>
    <td>
      <form class="inline" method="post"
        th:action="@{|/admin/delete/comment/${comment.id}|(next=${requestPath})}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?');">Delete
        </button>
      </form>
    </td>
  </tr>
</table>
<div class="page-footer">
  <div th:replace="~{macros :: pagination(${pagination}, '/admin/manage/comment/' + ${orderRule == 'time' ? 'by_time' : 'by_flag'})}"></div>
</div>
</th:block>
<th:block th:if="${#lists.isEmpty(comments)}">
  <div class="tip">
    <h5>No comments.</h5>
  </div>
</th:block>
</section>

</body>
</html>
